spring:
  shardingsphere:
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/test_db
        username: root
        password: root
    rules:
      sharding:
        tables:
          test_${0..9}:  # 分表范围test_0至test_9
            actual-data-nodes: ds0.test_${0..9}
            table-strategy:
              standard:
                sharding-column: batch_index  # 按批次索引分片
                sharding-algorithm-name: test_inline
        sharding-algorithms:
          test_inline:
            type: INLINE
            props:
              algorithm-expression: test_${batch_index}  # 直接映射到test_0至test_9
    props:
      sql-show: true  # 打印SQL，便于调试

# 线程池配置
thread:
  pool:
    core-size: 10
    max-size: 10
    queue-capacity: 100
    keep-alive: 60